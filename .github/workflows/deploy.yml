name: Deploy to one.com
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List remote directory
        run: |
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 22 "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}" "ls -la webroots/ && ls -la webroots/*/"
