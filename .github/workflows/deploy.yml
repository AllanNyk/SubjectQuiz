name: Deploy to one.com
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SFTP
        run: |
          sshpass -p "${{ secrets.FTP_PASSWORD }}" sftp -o StrictHostKeyChecking=no "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}" <<'SFTP'
          -mkdir webroots/www/subjectquiz
          -mkdir webroots/www/subjectquiz/css
          -mkdir webroots/www/subjectquiz/js
          -mkdir webroots/www/subjectquiz/data
          -mkdir webroots/www/subjectquiz/data/questions
          -mkdir webroots/www/subjectquiz/assets
          -mkdir webroots/www/subjectquiz/assets/textures
          put index.html webroots/www/subjectquiz/index.html
          put css/style.css webroots/www/subjectquiz/css/style.css
          put js/*.js webroots/www/subjectquiz/js/
          put data/questions/*.json webroots/www/subjectquiz/data/questions/
          put assets/textures/*.png webroots/www/subjectquiz/assets/textures/
          bye
          SFTP
